[project]
name = "pybricks-cli"
version = "0.1.0"
description = "The Pybricks command line interface"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "The Pybricks Authors", email = "dev@pybricks.com" }]
maintainers = [{ name = "David Lechner", email = "david@pybricks.com" }]
requires-python = ">=3.11"
dependencies = [
    "pybricks-core",
    "pybricks-client",
    "pybricks-service",
    "anyio>=4.14",
    "cyclopts>=4.22",
    "rich>=13.7",
    "typing-extensions>=4.15",
    "watchfiles>=1.2",
]

[project.scripts]
pb = "pb_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pb_cli"

[tool.uv.sources]
pybricks-core = { workspace = true }
pybricks-client = { workspace = true }
pybricks-service = { workspace = true }
