[project]
name = "pybricks-cli"
version = "0.1.0"
description = "The Pybricks command line interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Pybricks Authors", email = "dev@pybricks.com" }]
maintainers = [{ name = "David Lechner", email = "david@pybricks.com" }]
requires-python = ">=3.11"
keywords = ["pybricks", "lego", "micropython", "bluetooth", "robotics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "pybricks-core",
    "pybricks-client",
    "pybricks-service",
    "anyio>=4.14",
    "cyclopts>=4.22",
    "rich>=13.7",
    "typing-extensions>=4.15",
    "watchfiles>=1.2",
]

[project.scripts]
pb = "pb_cli.cli:main"

[project.urls]
homepage = "https://pybricks.com"
repository = "https://github.com/pybricks/pybricks-tools"
documentation = "https://pybricks.com/pybricks-tools/cli/"
"Changelog" = "https://github.com/pybricks/pybricks-tools/blob/main/packages/pb-cli/CHANGELOG.md"
"Support" = "https://github.com/pybricks/support/discussions"
"Issues" = "https://github.com/pybricks/support/issues"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pb_cli"

[tool.uv.sources]
pybricks-core = { workspace = true }
pybricks-client = { workspace = true }
pybricks-service = { workspace = true }
