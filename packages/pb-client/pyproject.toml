[project]
name = "pybricks-client"
version = "0.1.0"
description = "Client library for the Pybricks service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Pybricks Authors", email = "dev@pybricks.com" }]
maintainers = [{ name = "David Lechner", email = "david@pybricks.com" }]
requires-python = ">=3.11"
keywords = ["pybricks", "lego", "micropython", "bluetooth", "robotics"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "pybricks-core",
    "anyio>=4.14",
    "mpy-cross-v6>=1.1.1",
    "typing-extensions>=4.15",
]

[project.urls]
homepage = "https://pybricks.com"
repository = "https://github.com/pybricks/pybricks-tools"
documentation = "https://pybricks.com/pybricks-tools/reference/"
"Changelog" = "https://github.com/pybricks/pybricks-tools/blob/main/packages/pb-client/CHANGELOG.md"
"Support" = "https://github.com/pybricks/support/discussions"
"Issues" = "https://github.com/pybricks/support/issues"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pb_client"

[tool.uv.sources]
pybricks-core = { workspace = true }
