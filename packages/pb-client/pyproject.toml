[project]
name = "pybricks-client"
version = "0.1.0"
description = "Client library for the Pybricks daemon"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "The Pybricks Authors", email = "dev@pybricks.com" }]
maintainers = [{ name = "David Lechner", email = "david@pybricks.com" }]
requires-python = ">=3.11"
dependencies = [
    "pybricks-core",
    "anyio>=4.14",
    "mpy-cross-v6>=1.1.1",
    "typing-extensions>=4.15",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pb_client"

[tool.uv.sources]
pybricks-core = { workspace = true }
