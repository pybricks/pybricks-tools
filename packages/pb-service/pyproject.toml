[project]
name = "pybricks-service"
version = "0.1.0"
description = "The Pybricks service: manages hub connections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Pybricks Authors", email = "dev@pybricks.com" }]
maintainers = [{ name = "David Lechner", email = "david@pybricks.com" }]
requires-python = ">=3.11"
keywords = ["pybricks", "lego", "micropython", "bluetooth", "robotics"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "pybricks-core",
    "anyio>=4.14",
    "bleak>=1.1.0",
    "packaging>=22",
    "semver>=3",
    "typing-extensions>=4.15",
]

[project.scripts]
pb-service = "pb_service.cli:main"

[project.urls]
homepage = "https://pybricks.com"
repository = "https://github.com/pybricks/pybricks-tools"
"Changelog" = "https://github.com/pybricks/pybricks-tools/blob/main/packages/pb-service/CHANGELOG.md"
"Support" = "https://github.com/pybricks/support/discussions"
"Issues" = "https://github.com/pybricks/support/issues"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pb_service"

[tool.uv.sources]
pybricks-core = { workspace = true }
