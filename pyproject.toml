#
# Virtual workspace root: intentionally has no [project] table, so there is no
# root package to build or publish. Use `uv sync --all-packages` to install
# every member editable.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
lint = ["ruff>=0.16.5"]
typecheck = ["pyright>=1.1.400"]
test = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "coverage[toml]>=7.6",
    "anyio>=4.14",
]
docs = [
    # ProperDocs is the build tool, not MkDocs. MkDocs 2.0 removes the plugin
    # and theming systems with no migration path; ProperDocs continues the 1.6
    # line and reads both the mkdocs.* and properdocs.* entry point groups, so
    # Material, mkdocstrings, gen-files and literate-nav all load unchanged.
    "properdocs>=1.6.7",
    # Still required, as a library rather than as the build tool: Material and
    # mkdocstrings import mkdocs at runtime. Pinned below 2.0 for the reason
    # above; mkdocs-material pins it there too.
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "docs" },
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py311"
# examples/ is MicroPython that runs on a hub, not code that runs here: the
# pybricks modules it imports do not exist in this environment, and its style
# is whatever reads best for someone learning from it.
extend-exclude = [".venv", "examples"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific
    "TID",      # flake8-tidy-imports
    "ASYNC",    # flake8-async -- enforces the structured concurrency rules
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format
    "BLE",      # flake8-blind-except -- enforces "never swallow cancellation"
    "D",        # pydocstyle
]
ignore = [
    "E501",           # line length is the formatter's job
    "D203", "D213",   # mutually exclusive with the google convention pair
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pb_cli", "pb_client", "pb_core", "pb_service"]

# Structured concurrency, enforced mechanically. See CONTRIBUTING.md.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_task".msg = "Use an anyio task group (structured concurrency rule)."
"asyncio.ensure_future".msg = "Use an anyio task group (structured concurrency rule)."
"asyncio.gather".msg = "Use an anyio task group."
"asyncio.wait".msg = "Use an anyio task group plus a cancel scope."
"asyncio.set_event_loop_policy".msg = "Never change the loop policy; Windows named pipes require the Proactor loop."

[tool.ruff.lint.per-file-ignores]
# Docstrings are required on the library surface, not on CLI/daemon internals.
"packages/pb-cli/src/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"packages/pb-service/src/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"**/tests/**" = ["D"]
"docs/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# importlib mode: lets each package have its own tests/test_smoke.py without
# __init__.py files or globally unique basenames. Correct default for src layout.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
timeout = 30
markers = [
    "hardware: requires a real Pybricks hub (deselected in CI)",
    "console: requires a real OS console (Win32 console or POSIX pty)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["pb_cli", "pb_client", "pb_core", "pb_service"]
parallel = true

[tool.coverage.report]
show_missing = true
# A CI gate on the report combined across the three operating systems. One OS
# on its own reads a few points lower, because the other platforms' backends
# -- the AF_UNIX listener, the named pipe, the two ways of reading a keystroke
# -- count as missed there and are only credited once the runs are combined.
# So a local `coverage report` is a rough guide, not the gate. The target is
# 85; this rises to meet it as the gaps named in the plan are filled.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if sys.platform ==",
]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["packages/*/src", "packages/*/tests", "tests", "tools"]
# "ignore" rather than "exclude": an excluded file still gets red squiggles in
# the editor when it is open, and examples/ is MicroPython for a hub, whose
# imports cannot resolve here and never will.
ignore = ["examples"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
