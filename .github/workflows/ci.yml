name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if uv.lock is stale rather than silently resolving something else.
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-packages --group lint
      - run: uv run ruff format --check --diff .
        id: fmt
      # Report both failures rather than stopping at the first.
      - run: uv run ruff check --output-format=github .
        if: success() || steps.fmt.conclusion == 'failure'

  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check

  typecheck:
    # Three OSes because the IPC and console backends are different code on
    # each; a single OS only type-checks part of the tree.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-packages --all-groups
      - run: uv run pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          # ARM64 Windows is the primary dev machine; smoke one version.
          - { os: windows-11-arm, python: "3.11" }
          - { os: windows-11-arm, python: "3.12" }
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDEVMODE: "1"
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages --all-groups
      - run: uv run coverage run -m pytest -v -m "not hardware"
      - run: uv run coverage combine
        if: always()
      - run: uv run coverage xml
        if: always()
      # Named per runner so that the coverage job can put them in one folder,
      # and kept as data rather than only as XML: a report combined across the
      # runners needs what each of them measured, not each one's conclusion.
      - name: Name the coverage data after this runner
        if: always()
        run: mv .coverage .coverage.${{ matrix.os }}-${{ matrix.python }}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python }}
          # Hidden files are skipped unless asked for, and every coverage data
          # file begins with a dot.
          include-hidden-files: true
          path: .coverage.${{ matrix.os }}-${{ matrix.python }}
          if-no-files-found: ignore

  coverage:
    # The gate, and the only place the number means anything. One runner on
    # its own reads several points lower, because the other platforms' backends
    # -- the AF_UNIX listener, the named pipe, the two ways of reading a
    # keystroke -- count as missed there and are only credited once the runs
    # are put together.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-packages --all-groups
      - uses: actions/download-artifact@v4
        with:
          # The data files only. Flattening the XML reports as well would put
          # several files called coverage.xml in one folder.
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - run: uv run coverage combine coverage-data
      # Explicit rather than the fail_under in pyproject.toml, which is the
      # weaker number a single-runner report is measured against.
      - run: uv run coverage report --fail-under=85

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-packages --all-groups
      - run: uv run properdocs build --strict

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
