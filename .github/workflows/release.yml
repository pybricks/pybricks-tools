name: Release

# One package per tag, because the packages are released independently: the
# tag pybricks-core-v1.0.0 publishes pybricks-core 1.0.0 and nothing else.
# Tag pybricks-core first, then pybricks-client and pybricks-service, then
# pybricks-cli, so that each one's requirements are on PyPI before it is.
on:
  push:
    tags: ["pybricks-*-v*"]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # A tag that disagrees with the package it names is refused before
      # anything is built. A version on PyPI can never be uploaded again, so a
      # mistake caught after the upload is a version number lost.
      - name: Check the tag against the package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="${TAG%-v*}"
          version="${TAG##*-v}"
          dir="packages/pb-${package#pybricks-}"
          test -f "$dir/pyproject.toml" || { echo "::error::$TAG names no package"; exit 1; }
          actual="$(uv version --package "$package" --short)"
          test "$actual" = "$version" || { echo "::error::$TAG, but $package is $actual"; exit 1; }
          grep -qF "## [$version]" "$dir/CHANGELOG.md" || { echo "::error::$dir/CHANGELOG.md has no [$version] section"; exit 1; }
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - run: uv build --package "$PACKAGE" --out-dir dist
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    # The PyPI trusted publisher for each package names this workflow and this
    # environment, so a token is never stored anywhere.
    environment:
      name: pypi
    permissions:
      id-token: write # OIDC, which is how PyPI knows the upload is from here
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish --trusted-publishing always dist/*
